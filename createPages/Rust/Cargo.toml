[package]
name = "openbibledata-rust"
version = "0.1.0"
edition = "2024"
authors = ["Robert Hunt <Freely.Given.org+OBD@gmail.com>"]
license = "GPL-3.0-or-later"
description = "Rust backend extension for OpenBibleData"

[lib]
name = "openbibledata_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312"] }
regex = "1.12"
bos_books_codes = { path = "../../../BibleOrgSys/Rust/bos_books_codes" }

[dev-dependencies]
